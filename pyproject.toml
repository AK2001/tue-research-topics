[project]
name = "tue-research-topics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[mujoco]>=1.3.0",
    "h5py>=3.16.0",
    "numpy>=2.5.3",
    "requests>=2.34.2",
    "torch==2.13",
    "torchrl>=0.14.0",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
